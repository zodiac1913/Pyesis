name: Tests

on:
  push:
  pull_request:

jobs:
  unittest:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Linux Tk runtime
        run: |
          sudo apt-get update
          sudo apt-get install -y python3-tk

      - name: Install dependencies
        run: python -m pip install --upgrade pip -r requirements.txt

      - name: Run unit tests
        env:
          PYESIS_STATE_DIR: ${{ github.workspace }}/tests/.tmp-state
        run: python -m unittest discover -t . -s tests -q
